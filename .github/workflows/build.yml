name: Build TWRP for BF61

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup             /usr/share/dotnet /opt/hostedtoolcache/CodeQL             /usr/local/share/boost /usr/lib/jvm/*-temurin-*             /usr/share/swift /usr/local/lib/node_modules || true
          sudo docker image prune -af || true
          df -h /

      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          sudo apt-get install -y git-lfs \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop maven pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Initialize repo (minimal-manifest-twrp twrp-12.1)
        run: |
          mkdir -p $HOME/twrp-src
          cd $HOME/twrp-src
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p $HOME/.local/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o $HOME/.local/bin/repo
          chmod a+x $HOME/.local/bin/repo
          export PATH=$HOME/.local/bin:$PATH
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

      - name: Sync sources
        run: |
          export PATH=$HOME/.local/bin:$PATH
          cd $HOME/twrp-src
          repo sync -c -j4 --no-tags --fail-fast

      - name: Clone device tree into source tree
        run: |
          cd $HOME/twrp-src
          mkdir -p device/famue
          git clone --depth=1 https://github.com/zhuzhuzihan/android_device_famue_bf61 device/famue/bf61
          ls -la device/famue/bf61/
          ls -la device/famue/bf61/prebuilt/dtb/dtb.img device/famue/bf61/prebuilt/kernel

      - name: Build boot image
        run: |
          cd $HOME/twrp-src
          set -o pipefail
          source build/envsetup.sh
          lunch twrp_bf61-eng
          mka bootimage -j$(nproc) 2>&1 | tee build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-bf61
          path: |
            $HOME/twrp-src/out/target/product/bf61/boot.img
            $HOME/twrp-src/out/target/product/bf61/*.zip
            $HOME/twrp-src/build.log
          if-no-files-found: warn
